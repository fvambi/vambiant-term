# cbindgen 0.29.x configuration. Output is checked in at include/vt_ffi.h and
# diffed in CI (`mise run abi:check`). ABI drift is a memory-safety bug.
language = "C"
header = "/* Generated by cbindgen from crates/vt-ffi. Do not edit; run `mise run abi:update`. */"
include_guard = "VT_FFI_H"
include_version = false
cpp_compat = true
usize_is_size_t = true
style = "both"
sort_by = "Name"

[export]
prefix = "Vt"

[enum]
# C enum constants share one namespace; `VtScrollTo_Top`, not `Top`.
prefix_with_name = true

[fn]
sort_by = "Name"

[parse]
parse_deps = false
