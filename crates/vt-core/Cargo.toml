[package]
name = "vt-core"
description = "Terminal state: grid, cells, damage, modes behind the TerminalCore trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["ghostty"]
# Primary backend (ADR-0001 amendment). Needs zig 0.15.2 and the vendored
# third_party/ghostty submodule; `mise` exports the build environment.
ghostty = ["dep:libghostty-vt"]

[dependencies]
libghostty-vt = { version = "0.2.1", optional = true, default-features = false }
serde.workspace = true
thiserror.workspace = true

[lints]
workspace = true
