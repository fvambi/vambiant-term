# Mirrors docs/08 §9. Every job is a `mise run` task so it runs identically locally.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:   # runs `full` on demand
  schedule:
    - cron: "17 3 * * *"   # nightly
env:
  # mise installs tools in parallel by default; the cargo-installed tools
  # (cbindgen, cargo-deny) then race rustup while it is still adding
  # rustfmt/clippy to the toolchain. One job at a time is a few seconds
  # slower and deterministic.
  MISE_JOBS: "1"
jobs:
  fast:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v2
        with:
          # The first runs cached a toolchain whose rustfmt/clippy install
          # had raced and failed; a new key leaves that cache behind.
          cache_key_prefix: mise-v1
      # Belt and braces: the components rust-toolchain.toml asks for.
      - run: mise exec -- rustup component add rustfmt clippy
      - run: mise run ci-fast
  full:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v2
        with:
          # The first runs cached a toolchain whose rustfmt/clippy install
          # had raced and failed; a new key leaves that cache behind.
          cache_key_prefix: mise-v1
      # Belt and braces: the components rust-toolchain.toml asks for.
      - run: mise exec -- rustup component add rustfmt clippy
      - run: mise run ci-full
  nightly:
    if: github.event_name == 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v2
        with:
          # The first runs cached a toolchain whose rustfmt/clippy install
          # had raced and failed; a new key leaves that cache behind.
          cache_key_prefix: mise-v1
      # Belt and braces: the components rust-toolchain.toml asks for.
      - run: mise exec -- rustup component add rustfmt clippy
      - run: mise run ci-nightly
