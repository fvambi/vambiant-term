# Mirrors docs/08 §9. Every job is a `mise run` task so it runs identically locally.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly
env:
  # mise installs tools in parallel by default; the cargo-installed tools
  # (cbindgen, cargo-deny) then race rustup while it is still adding
  # rustfmt/clippy to the toolchain. One job at a time is a few seconds
  # slower and deterministic.
  MISE_JOBS: "1"
jobs:
  fast:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run ci-fast
  full:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run ci-full
  nightly:
    if: github.event_name == 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run ci-nightly
