# --- Inline hook defined in the profile layer itself (does a profile count as an "active config layer"?) ---
[[hooks.SessionStart]]
matcher = "startup"
[[hooks.SessionStart.hooks]]
type = "command"
command = "/usr/bin/env python3 /tmp/vt-m0/codex/hooks/capture.py ProfileInlineSessionStart"
