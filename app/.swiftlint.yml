# SwiftLint for the shell. Strict in CI (scripts/ci/swift-lint.sh).
included:
  - Sources
  - Tests
excluded:
  - .build
line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true
identifier_name:
  min_length: 1
  excluded: [id, r, g, b, a, x, y, c, w, h, i, n, p, s, t, d, f, m, v, u, e, k, cw, ch, ox, oy, cc, uv, fg, bg]
type_body_length:
  warning: 400
  error: 500
file_length:
  warning: 500
  error: 600
function_body_length:
  warning: 80
  error: 120
cyclomatic_complexity:
  warning: 20
  error: 30
large_tuple:
  warning: 4
disabled_rules:
  - todo
  - trailing_comma
  - opening_brace
  - multiple_closures_with_trailing_closure
  - force_cast
  - force_try
  - force_unwrapping
