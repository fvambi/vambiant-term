# cargo-deny configuration (ADR-0010). Run via `mise run deny`.

[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# alacritty_terminal is Apache-2.0 *only*; cbindgen/uniffi are MPL-2.0 but are
# build tools, not linked dependencies. Anything not listed fails the build and
# must be added here with a note in docs/10-research-notes.md.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true          # workspace path deps carry no version yet
highlight = "all"
# Hot-path crates must keep a dependency tree you can read on one screen
# (docs/02 §9). Enforced by review for now; add `deny` entries as they bite.
deny = [
  { crate = "openssl-sys", reason = "use rustls / native-tls via Security.framework" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
